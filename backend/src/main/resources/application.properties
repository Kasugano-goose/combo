spring.application.name=combo
server.port=8090

# ===== 数据库 =====
# 本地开发默认值；生产环境请通过环境变量注入：DB_USERNAME / DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/combo?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 每次启动执行幂等的 schema.sql / data.sql（建表 + 种子数据）
spring.sql.init.mode=always

# ===== Redis =====
# 本地开发默认值；生产环境请通过环境变量注入：REDIS_HOST / REDIS_PORT
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
