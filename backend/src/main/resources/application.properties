spring.application.name=combo
server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3306/combo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 会话持久化到 Redis：后端重启不丢登录态（无需重新登录）
spring.session.store-type=redis
spring.session.redis.namespace=combo:session
spring.session.redis.flush-mode=on_save
# 会话有效期（开发期拉长，避免频繁过期）
server.servlet.session.timeout=30d
spring.session.timeout=30d
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always